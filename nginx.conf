# ============================================================
# Nginx Reverse Proxy — AI Autonomous Testing Agent
# ============================================================
# Routes:
#   /          → frontend:3000  (Next.js SSR)
#   /api/      → backend:8000   (FastAPI REST)
#   /ws/       → backend:8000   (WebSocket upgrade)
#   /allure/   → allure:5050    (Allure report viewer)
# ============================================================

user nginx;
worker_processes auto;                     # one worker per CPU core
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
    use epoll;                             # Linux best-practice event model
}

http {
    include      /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------
    # Logging
    # --------------------------------------------------------
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # --------------------------------------------------------
    # Performance
    # --------------------------------------------------------
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 50M;             # allow large test artifact uploads

    # --------------------------------------------------------
    # Gzip Compression
    # --------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_min_length   256;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        application/vnd.ms-fontobject
        application/x-font-ttf
        font/opentype
        image/svg+xml
        image/x-icon;

    # --------------------------------------------------------
    # Rate Limiting — protect API from abuse
    # --------------------------------------------------------
    # 10 r/s per IP for API endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    # 30 r/s per IP for frontend pages
    limit_req_zone $binary_remote_addr zone=frontend_limit:10m rate=30r/s;

    # --------------------------------------------------------
    # Upstream Definitions
    # --------------------------------------------------------
    upstream frontend_upstream {
        server frontend:3000;
        keepalive 32;
    }

    upstream backend_upstream {
        server backend:8000;
        keepalive 32;
    }

    upstream allure_upstream {
        server allure:5050;
        keepalive 8;
    }

    # --------------------------------------------------------
    # Main Server Block (HTTP → HTTPS redirect in production)
    # --------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # Security Headers
        add_header X-Frame-Options           "SAMEORIGIN"            always;
        add_header X-Content-Type-Options    "nosniff"               always;
        add_header X-XSS-Protection          "1; mode=block"         always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy        "camera=(), microphone=(), geolocation=()" always;
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' ws: wss:; font-src 'self' data:;" always;

        # ── Frontend (Next.js) ──────────────────────────────
        location / {
            limit_req zone=frontend_limit burst=50 nodelay;

            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            # Next.js page caching
            proxy_cache_bypass $http_upgrade;
            proxy_read_timeout 60s;
        }

        # ── Next.js Hot Reload (HMR) websocket ─────────────
        location /_next/webpack-hmr {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade    $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host       $host;
        }

        # ── REST API ────────────────────────────────────────
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;

            # Strip the /api prefix before forwarding to FastAPI
            rewrite ^/api/(.*) /$1 break;

            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_set_header   Connection        "";

            proxy_read_timeout  120s;        # long timeout for AI inference calls
            proxy_connect_timeout 10s;
            proxy_send_timeout  120s;

            # CORS preflight is handled by FastAPI; don't duplicate here
        }

        # ── WebSocket (real-time test status updates) ───────
        location /ws/ {
            proxy_pass         http://backend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade           $http_upgrade;
            proxy_set_header   Connection        "upgrade";
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_read_timeout 3600s;            # keep WS alive for long-running tests
            proxy_send_timeout 3600s;
        }

        # ── Allure Reports ───────────────────────────────────
        location /allure/ {
            limit_req zone=frontend_limit burst=20 nodelay;

            proxy_pass         http://allure_upstream/;
            proxy_http_version 1.1;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Static Assets — long cache TTL ──────────────────
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass         http://frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            expires            1y;
            add_header         Cache-Control "public, immutable";
            access_log         off;
        }

        # ── Health check endpoint (for load balancers) ──────
        location /nginx-health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    # --------------------------------------------------------
    # HTTPS Server Block (uncomment and configure for TLS)
    # --------------------------------------------------------
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #
    #     ssl_protocols             TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #     ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:...;
    #     ssl_session_cache         shared:SSL:10m;
    #     ssl_session_timeout       10m;
    #
    #     add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    #
    #     # ... same location blocks as above ...
    # }
}
